name: Ortho mask regression

on:
  pull_request:
    paths:
      - "scripts/modules/process_orthos.py"
      - "tests/test_ortho_masks.py"
      - "tests/test_large_ortho.py"
      - "tests/test_aoi_converter.py"
      - "tests/test_aoi_batch.py"
      - "tests/test_input_eligibility.py"
      - "scripts/input_eligibility.py"
      - "tests/test_central_aoi_catalogue.py"
      - "scripts/central_aoi_catalogue.py"
      - "tests/test_lidar_auto_install.py"
      - "scripts/ensure_lidar_support.py"
      - "scripts/modules/process_large_ortho.py"
      - "scripts/modules/process_aoi_converter.py"
      - "scripts/modules/aoi_batch.py"
      - "tests/test_delivery_naming.py"
      - "scripts/modules/atco_delivery.py"
      - ".github/workflows/ortho-mask-regression.yml"
  workflow_dispatch:

jobs:
  rasterio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy rasterio geopandas pyproj shapely
      - name: Run TIFF/alpha tests
        run: python -m unittest discover -s tests -v
