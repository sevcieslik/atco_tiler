name: GUI dashboard smoke tests

on:
  pull_request:
    paths:
      - "scripts/atco_retiler_gui.py"
      - "tests/test_gui_dashboard.py"
      - ".github/workflows/gui-dashboard.yml"
  workflow_dispatch:

jobs:
  tkinter-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install X virtual framebuffer
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb python3-tk
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy rasterio geopandas pyproj shapely
      - name: Compile GUI
        run: python -m py_compile scripts/atco_retiler_gui.py
      - name: Test GUI interactions
        run: xvfb-run -a python -m unittest discover -s tests -p "test_gui_dashboard.py" -v
